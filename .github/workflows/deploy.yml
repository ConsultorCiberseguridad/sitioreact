name: Build, Dependency-Check y Deploy a GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: self-hosted
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        shell: cmd
        run: npm ci

      - name: Ejecutar OWASP Dependency-Check local en Windows
        shell: cmd
        run: dependency-check.bat --project "sitioreact" --scan . --exclude "**/node_modules/**" --exclude "**/build/**" --out .\dc-report --format HTML --format JSON

      - name: Subir reportes de Dependency-Check como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dc-report/

      - name: Compilar React
        shell: cmd
        run: npm run build

      - name: Empaquetar build en ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = if (Test-Path ".\build") { ".\build" } elseif (Test-Path ".\dist") { ".\dist" } else { $null }
          if (-not $outDir) {
            Write-Error "No se encontró la carpeta de compilación (ni .\build ni .\dist). Revisá la salida de 'npm run build'."
          }
          Get-ChildItem -Path $outDir | Select-Object -First 10
          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath ".\site-build.zip" -Force

      - name: Subir ZIP de build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: react-build-zip
          path: site-build.zip

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Descargar ZIP de build
        uses: actions/download-artifact@v4
        with:
          name: react-build-zip

      - name: Preparar carpeta build
        run: |
          mkdir -p build
          unzip -q site-build.zip -d build

      - name: Subir artefacto de build para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4