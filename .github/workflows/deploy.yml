name: Analisis Local, Build y Deploy a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias en local
        shell: cmd
        run: npm ci

      - name: Ejecutar OWASP Dependency-Check local (bloquea CVSS >= 7)
        shell: cmd
        run: |
          if exist dependency-check-suppressions.xml (
            dependency-check.bat --project "sitioreact" --scan . --exclude "**/node_modules/**" --exclude "**/build/**" --suppression .\dependency-check-suppressions.xml --failOnCVSS 7 --out .\dc-report --format HTML --format JSON
          ) else (
            dependency-check.bat --project "sitioreact" --scan . --exclude "**/node_modules/**" --exclude "**/build/**" --failOnCVSS 7 --out .\dc-report --format HTML --format JSON
          )

      - name: Guardar copia del reporte en carpeta local del equipo
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $destinoLocal = "C:\ReportesDC\sitioreact"
          if (Test-Path ".\dc-report") {
            New-Item -ItemType Directory -Path $destinoLocal -Force | Out-Null
            Copy-Item -Path ".\dc-report\*" -Destination $destinoLocal -Recurse -Force
            Write-Host "Reporte copiado en: $destinoLocal"
          } else {
            Write-Warning "No se encontró la carpeta .\dc-report para copiar."
          }

      - name: Alerta por vulnerabilidades Altas o Críticas
        if: failure()
        shell: powershell
        run: |
          $msg = "ALERTA DE SEGURIDAD: Se detectaron vulnerabilidades con severidad ALTA o CRITICA (CVSS >= 7.0) en 'sitioreact'. Se bloqueó el build y el deploy a GitHub Pages. Revisá el reporte en C:\ReportesDC\sitioreact."
          Write-Host "::error::$msg"

      - name: Compilar React en local
        shell: cmd
        run: |
          set CI=false&& npm run build
          if exist build (echo Carpeta de salida: build) else (if exist dist (echo Carpeta de salida: dist) else (echo No se encontro carpeta build ni dist && exit /b 1))

      - name: Publicar build en GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true