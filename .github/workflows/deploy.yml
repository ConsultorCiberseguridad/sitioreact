name: Build, Dependency-Check y Deploy a GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-scan:
    runs-on: self-hosted
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Ejecutar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "sitioreact"
          path: "."
          format: "ALL"
          out: "dc-report"
          args: >
            --exclude "**/node_modules/**"
            --exclude "**/build/**"

      - name: Subir reportes de Dependency-Check como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: dc-report/

      - name: Instalar dependencias y compilar React
        run: |
          npm ci
          npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de build para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4